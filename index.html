<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepMPSI 🐍</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- POPUP PREMIERE CONNEXION -->

<div id="pseudoPopup" class="popup">


<div class="popup-card">


<h2>🐍 Bienvenue sur PrepMPSI</h2>


<p>
Comment dois-je t'appeler ?
</p>


<input 
id="pseudoInput"
placeholder="Ton prénom ou pseudo">


<button id="startButton">
Commencer 🚀
</button>


</div>


</div>








<!-- HEADER -->


<header>


<button id="menuMobile">
☰
</button>



<div class="logo-zone">


<h1>
🐍 PrepMPSI
</h1>


<p>
Terminale → MPSI
</p>


</div>




<div class="header-xp">

⭐ <span id="xp">0</span> XP

</div>



</header>








<div class="layout">





<!-- MENU CHAPITRES -->


<aside id="menuChapitre">


<div class="menu-title">


<h2>
📚 Chapitres
</h2>



<button id="fermerMenu">
✕
</button>


</div>





<div class="chapitres">


<button>
Variables
</button>


<button>
Types
</button>


<button>
Affectations
</button>


<button>
Conditions
</button>


<button>
Boucles
</button>


<button>
Fonctions
</button>


<button>
Listes
</button>


<button>
Algorithmique
</button>


</div>






<div class="progression">


<h3>
🏆 Progression
</h3>


<p>
Niveau :
<span id="niveau">
Débutant
</span>
</p>



<div class="xp-bar">

<div id="xpProgress"></div>

</div>



<p>
<span id="xpText">
0 XP
</span>
</p>



</div>



</aside>









<!-- CONTENU -->


<main>




<!-- PAGE ACCUEIL -->


<section id="pageAccueil">





<!-- ASSISTANT SERPENT -->


<div class="assistant">


<div class="snake">

🐍

</div>



<div>


<h3>
PrepSnake
</h3>


<p id="messageSnake">

Salut ! Prêt à coder ?

</p>


</div>


</div>








<h2 id="titre">
Variables
</h2>



<p id="compteur">
Exercice 1 / 10
</p>








<div id="enonce">


Chargement...

</div>








<textarea 
id="code"
placeholder="Écris ton code Python ici...">

</textarea>








<div class="buttons">


<button id="verifier">

✓ Vérifier

</button>



<button id="suivant">

➡ Suivant

</button>


</div>









<div class="assistant-actions">


<button id="indice">

💡 Demander un indice au serpent

</button>



<button id="aideIA">

🐍 Aide PrepSnake

</button>


</div>








<div id="aideTexte">


</div>







<div class="output">


Sortie :

</div>







</section>













<!-- PAGE COURS -->


<section id="pageCours" class="hidden">


<h2>
📚 Cours
</h2>



<div id="listeCours">

</div>


</section>













<!-- PAGE PROFIL -->


<section id="pageProfil" class="hidden">



<h2>
🏆 Profil
</h2>



<div class="profil-card">



<h3>
👤 <span id="pseudoProfil">
Utilisateur
</span>
</h3>



<p>
XP :
<span id="xpProfil">
0
</span>
</p>



<p>
Niveau :
<span id="niveauProfil">
Débutant
</span>
</p>



<button id="changerPseudo">

✏️ Modifier mon pseudo

</button>



</div>



</section>








</main>


</div>









<!-- BARRE MOBILE -->


<nav class="bottom-nav">


<button id="accueil" class="nav-btn active">

🏠

<span>
Accueil
</span>

</button>



<button id="cours" class="nav-btn">

📚

<span>
Cours
</span>

</button>



<button id="profil" class="nav-btn">

🏆

<span>
Profil
</span>

</button>


</nav>








<script src="data/exercices.js"></script>

<script src="app.js"></script>



</body>

</html>
