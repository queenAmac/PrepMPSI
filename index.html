<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepMPSI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>


<button id="menuMobile">
☰
</button>


<div>

<h1>🐍 PrepMPSI</h1>

<p>
Terminale → MPSI
</p>

</div>


<div class="header-xp">

⭐ <span id="xp">0</span> XP

</div>


</header>





<div class="layout">



<!-- MENU CHAPITRES ORDINATEUR -->


<aside id="menuChapitre">


<h2>
📚 Chapitres
</h2>



<div class="chapitres">


<button>Variables</button>

<button>Types</button>

<button>Affectations</button>

<button>Opérations</button>

<button>Conditions</button>

<button>Boucles</button>

<button>Fonctions</button>

<button>Listes</button>

<button>Dictionnaires</button>

<button>Algorithmique</button>


</div>



<div class="progression">


<h3>
🏆 Progression
</h3>


<p>
Niveau :
<span id="niveau">
Débutant
</span>
</p>


<div class="xp-bar">

<div id="xpProgress"></div>

</div>


<p id="xpText">
0 / 100 XP
</p>


</div>


</aside>








<!-- CONTENU PRINCIPAL -->


<main>



<section id="pageAccueil">



<h2 id="titre">
Variables
</h2>


<p id="compteur">
Exercice 1 / 10
</p>



<div class="card exercice">


<h3>
Énoncé
</h3>


<p id="enonce">

Chargement...

</p>


</div>





<textarea 
id="code"
placeholder="Écris ton code Python ici...">
</textarea>






<div class="buttons">


<button id="verifier">

✓ Vérifier

</button>



<button id="suivant">

➡ Suivant

</button>



</div>





<div class="card output">

Sortie :

</div>





</section>










<!-- PAGE COURS -->


<section id="pageCours" class="hidden">


<h2>
📚 Cours
</h2>


<p>
Choisis un chapitre
</p>



<div id="listeCours">

</div>



</section>









<!-- PAGE PROFIL -->


<section id="pageProfil" class="hidden">


<h2>
🏆 Profil
</h2>



<div class="card profil-card">


<h3>
Progression
</h3>


<p>
XP :
<span id="xpProfil">
0
</span>
</p>


<p>
Niveau :
<span id="niveauProfil">
Débutant
</span>
</p>



<div class="xp-bar">

<div id="xpProgressProfil"></div>

</div>


</div>



</section>







</main>


</div>










<!-- NAVIGATION MOBILE -->


<nav class="bottom-nav">


<button id="accueil" class="nav-btn active">

🏠

<span>
Accueil
</span>

</button>




<button id="cours" class="nav-btn">

📚

<span>
Cours
</span>

</button>





<button id="profil" class="nav-btn">

🏆

<span>
Profil
</span>

</button>



</nav>






<script src="data/exercices.js"></script>

<script src="app.js"></script>


</body>

</html>
