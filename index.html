<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepMPSI 🐍</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🐍 PrepMPSI</h1>

<p>
Préparation Terminale → MPSI
</p>

</header>




<div class="container">


<aside>


<h2>📚 Chapitres</h2>


<button>Variables</button>

<button>Types</button>

<button>Affectations</button>

<button>Opérations</button>

<button>Conditions</button>

<button>Boucles</button>

<button>Fonctions</button>

<button>Listes</button>

<button>Dictionnaires</button>

<button>Tuples</button>

<button>Algorithmique</button>




<div class="progression">

<h3>🏆 Progression</h3>


<p>
⭐ XP :
<span id="xp">0</span>
</p>


<p>
🎓 Niveau :
<span id="niveau">
Débutant
</span>
</p>


<hr>


<p>
📊 Chapitre :
<span id="chapitreProgression">
0 %
</span>
</p>


<div class="barre">

<div id="barreXP"></div>

</div>


<p>
✅ Exercices réussis :
<span id="reussis">
0
</span>
</p>


</div>


</aside>






<main>


<h2 id="titre">
Variables
</h2>



<p id="compteur">
Exercice 1
</p>




<div class="carte">


<h3>✏️ Énoncé</h3>


<p id="enonce">
Chargement...
</p>


</div>






<div class="aide">


<button id="cours">
📚 Cours
</button>


<button id="indice">
💡 Indice
</button>


<button id="correction">
🧠 Correction
</button>



</div>




<div id="aideTexte"
class="carte">

</div>





<textarea
id="code"
placeholder="Écris ton code Python ici...">
</textarea>





<button id="verifier">
✓ Vérifier
</button>


<button id="suivant">
➡️ Exercice suivant
</button>





<div class="output">

Sortie :

</div>



</main>



</div>





<script src="data/exercices.js"></script>

<script src="app.js"></script>


</body>

</html>
